<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="60%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Ribbon 1 Gradient (Rose to Sunset Amber) -->
    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Ribbon 2 Gradient (Golden Coral) -->
    <linearGradient id="ribbon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Star Glow -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Subtle Ring for Depth -->
  <rect x="16" y="16" width="480" height="480" rx="116" stroke="rgba(255, 255, 255, 0.2)" stroke-width="6" />

  <!-- Unique CalculateLove Brand Crest: Interlocking Infinity-Heart with Calculation Node -->
  <g filter="url(#softGlow)">
    <!-- Interlocking Left Arc (Infinity + Heart lobe) -->
    <path
      d="M176 138 C116 138 68 186 68 246 C68 318 136 364 256 432 C376 364 444 318 444 246 C444 186 396 138 336 138 C294 138 266 164 256 182 C246 164 218 138 176 138 Z"
      fill="none"
      stroke="url(#ribbon1)"
      stroke-width="48"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner Mathematical Infinity Ribbon Loop -->
    <path
      d="M168 256 C168 220 200 200 236 230 L276 282 C312 312 344 292 344 256 C344 220 312 200 276 230 L236 282 C200 312 168 292 168 256 Z"
      fill="none"
      stroke="url(#ribbon2)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Precision Center Heart Jewel -->
    <path
      d="M256 228 C251 216 237 212 227 222 C217 232 221 247 256 272 C291 247 295 232 285 222 C275 212 261 216 256 228 Z"
      fill="#FFFFFF"
    />

    <!-- Calculating Sparkle Node (Four-point Star) -->
    <path
      d="M380 96 Q380 136 420 136 Q380 136 380 176 Q380 136 340 136 Q380 136 380 96 Z"
      fill="url(#sparkleGrad)"
    />

    <!-- Micro Accent Sparkle -->
    <circle cx="132" cy="160" r="10" fill="#FDE047" opacity="0.9" />
  </g>
</svg>
